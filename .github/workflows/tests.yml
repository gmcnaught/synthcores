name: tests

# ci-scripts runs every cores/*/tests/ci.sh and modules/*/tests/ci.sh on every change: each
# core's and module's ROM-free tests behind one entry point (exit 0 pass, 77 skipped, anything
# else failed). The skip and pass counts go to the run's summary page.
#
# The test job runs each core's test suite (Verilator benches, lockstep against the reference
# models, repo hygiene) for the cores a change touches. A change to synthframe's HDL, cmake or
# tools, or to this file, runs every core. The JV-880 has no suite of its own yet; a change to it runs the SC-55 job (shared
# modules) and the panel frame test. The CZ-101's lockstep needs MAME and ROMs and runs locally;
# a change to its HDL runs the Proteus job for the panel frame test. ROM-dependent tests skip
# without ROMs. Proteus runs the P2K sound/flash model unit tests (no ROMs needed); its MAME
# corpus and RTL replay need ROMs and run locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every core's mister/files.qip and mister/<core>.qsf must match what synthcore writes from
  # its cfg/ files. Runs on every change (a few seconds).
  synthcore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Generated Quartus files match cfg/
        run: python3 modules/synthframe/bin/synthcore check
      - name: synthcore unit tests
        run: python3 modules/synthframe/tests/synthcore/test_synthcore.py

  changes:
    runs-on: ubuntu-24.04
    outputs:
      cores: ${{ steps.pick.outputs.cores }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'modules/synthframe/hdl/**'
              - 'modules/synthframe/cmake/**'
              - 'modules/synthframe/tools/**'
              - '.github/workflows/tests.yml'
              - '.github/actions/**'
            sc55:
              - 'cores/sc55/**'
              - 'cores/jv880/**'
              - 'modules/roland/**'
              - 'modules/nuked-sc55'
              - 'modules/synthframe/ver/**'
            synclavier:
              - 'cores/synclavier/**'
            proteus:
              - 'cores/proteus/**'
              - 'cores/cz101/hdl/**'
              - 'modules/synthframe/ver/**'
            mt32:
              - 'cores/mt32/**'
              - 'modules/synthframe/ver/**'
              - 'modules/nuked-mt32'
            p2k:
              - 'cores/p2k/**'
              - 'modules/synthframe/ver/**'
              - 'cores/proteus/p2k/rtl/**'
              - 'cores/proteus/tools/p2k_*'
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "${{ steps.filter.outputs.shared }}" = true ]; then
            echo 'cores=["sc55","synclavier","proteus","mt32","p2k"]' >> "$GITHUB_OUTPUT"
          else
            echo "cores=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "shared"))')" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: ${{ needs.changes.outputs.cores != '[]' && needs.changes.outputs.cores != '' }}
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.changes.outputs.cores) }}
    name: tests (${{ matrix.core }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cores/${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-sim

      - name: Build reference model and Verilator benches (SC-55)
        if: matrix.core == 'sc55'
        run: |
          cmake -S sim -B out/sim -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          ninja -C out/sim

      - name: P2K sound and flash model unit tests (Proteus)
        if: matrix.core == 'proteus'
        run: CXX=g++-14 p2k/model/build.sh

      - name: Panel renderer frame hashes (SC-55, JV-880, Proteus/1, CZ-101, MT-32, P2K)
        if: matrix.core == 'sc55' || matrix.core == 'proteus' || matrix.core == 'mt32' || matrix.core == 'p2k'
        run: python ../../modules/synthframe/ver/panel/test_panel.py

      - name: MIDI out serial line (synthframe_midi_tx; SC-55, JV-880, MT-32)
        if: matrix.core == 'sc55' || matrix.core == 'mt32'
        run: python ../../modules/synthframe/ver/midi/test_midi_tx.py

      # A test that cannot run (no ROMs) exits 77, or (the SC-55's testlib suites) prints
      # "N passed, M skipped" / unittest's skipped=M: both are counted as skips, shown as warnings and on the summary page.
      - name: Run tests
        shell: bash
        env:
          SC55_REF_BUILD: out/sim/ref
        run: |
          pass=0; skip=0; fail=0
          for t in tests/test_*.py tests/*/test_*.py; do
            [ -f "$t" ] || continue
            echo "== $t"
            rc=0; python "$t" 2>&1 | tee /tmp/test.log || rc=$?
            n=$(grep -oE '[0-9]+ skipped|skipped=[0-9]+' /tmp/test.log | tail -1 | grep -oE '[0-9]+' || true)
            if [ "$rc" = 77 ]; then
              skip=$((skip + 1)); echo "::warning title=skipped::$t: $(grep -m1 '^SKIP' /tmp/test.log || echo skipped)"
            elif [ "$rc" = 0 ]; then
              pass=$((pass + 1))
              if [ -n "$n" ] && [ "$n" != 0 ]; then
                skip=$((skip + n)); echo "::warning title=skipped::$t: $n test(s) skipped (no ROMs on the runner)"
              fi
            else
              fail=$((fail + 1)); echo "::error title=failed::$t exited $rc"
            fi
          done
          echo "### tests (${{ matrix.core }}): $pass passed, $skip skipped, $fail failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" = 0 ]

  ci-list:
    runs-on: ubuntu-24.04
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: bash
        run: |
          shopt -s nullglob
          echo "scripts=$(printf '%s\n' cores/*/tests/ci.sh modules/*/tests/ci.sh | jq -R . | jq -cs 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  ci-scripts:
    needs: ci-list
    if: ${{ needs.ci-list.outputs.scripts != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.ci-list.outputs.scripts) }}
    name: ci.sh (${{ matrix.script }})
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-sim
      - name: Run
        shell: bash
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          rc=0; bash "$SCRIPT" 2>&1 | tee /tmp/ci.log || rc=$?
          last=$(grep -v '^[[:space:]]*$' /tmp/ci.log | tail -1 | tr '|\t' '/ ' || true)
          mkdir -p /tmp/result
          case "$rc" in
            0)  r=pass ;;
            77) r=skip; echo "::warning title=skipped::$SCRIPT: $(grep -m1 '^SKIP' /tmp/ci.log || echo "$last")" ;;
            *)  r=fail; echo "::error title=failed::$SCRIPT exited $rc" ;;
          esac
          printf '%s\t%s\t%s\n' "$r" "$SCRIPT" "$last" > /tmp/result/result.tsv
          echo "| $r | \`$SCRIPT\` | $last |" >> "$GITHUB_STEP_SUMMARY"
          [ "$r" != fail ]
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ strategy.job-index }}
          path: /tmp/result/result.tsv
          if-no-files-found: ignore

  ci-summary:
    needs: ci-scripts
    if: always() && needs.ci-scripts.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: results
          merge-multiple: false
      - name: Counts
        shell: bash
        run: |
          shopt -s nullglob
          cat results/*/result.tsv > all.tsv 2>/dev/null || : > all.tsv
          p=$(grep -c '^pass' all.tsv || true); s=$(grep -c '^skip' all.tsv || true); f=$(grep -c '^fail' all.tsv || true)
          {
            echo "### ci.sh: $p passed, $s skipped, $f failed"
            echo
            echo "| result | script | last line |"
            echo "|---|---|---|"
            sort all.tsv | awk -F'\t' '{ printf "| %s | `%s` | %s |\n", $1, $2, $3 }'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$f" = 0 ]
