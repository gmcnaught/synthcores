name: Build RBF

# Compiles each MiSTer core (cores/<core>/mister/*.qpf) with Quartus Lite 17.0 in the
# raetro/quartus:17.0 Docker image on ubuntu-latest: on a release tag (v*) every core, on
# demand the cores asked for (all by default). The whole repo (without .git)
# goes into the container so cores can use shared files under modules/. Each core's
# mister/build.sh fails the job on a failed compile or negative slack, after the reports are
# saved. The RBF and the Quartus reports are uploaded as artifacts <core>-rbf and
# <core>-quartus-reports.

on:
  workflow_dispatch:
    inputs:
      cores:
        description: 'Cores to build, JSON list (blank = all), e.g. ["sc55"]'
        required: false
        default: ''
      seed:
        description: Fitter seed override (integer; blank = the QSF's; SC-55 and Synclavier)
        required: false
        default: ''
  # Releases only (a v* tag) and on demand: day-to-day builds run on the Windows build host
  # (scripts/build-hosts/winbuild.sh), which gates pull requests.
  push:
    tags: ['v*']

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      cores: ${{ steps.pick.outputs.cores }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'modules/synthframe/hdl/**'
              - 'modules/synthframe/target/**'
              - '.github/workflows/build-rbf.yml'
            sc55:
              - 'cores/sc55/hdl/**'
              - 'modules/roland/**'
              - 'cores/sc55/mister/**'
            synclavier:
              - 'cores/synclavier/hdl/**'
              - 'cores/synclavier/mister/**'
            proteus:
              - 'cores/proteus/mister/**'
            jv880:
              - 'cores/jv880/hdl/**'
              - 'cores/jv880/mister/**'
              - 'modules/roland/**'
            mt32:
              - 'cores/mt32/hdl/**'
              - 'cores/mt32/mister/**'
            cz101:
              - 'cores/cz101/hdl/**'
              - 'cores/cz101/mister/**'
      - id: pick
        shell: bash
        run: |
          all='["sc55","synclavier","proteus","jv880","mt32","cz101"]'
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            req='${{ github.event.inputs.cores }}'
            echo "cores=${req:-$all}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = push ] || [ "${{ steps.filter.outputs.shared }}" = true ]; then
            echo "cores=$all" >> "$GITHUB_OUTPUT"
          else
            echo "cores=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "shared"))')" >> "$GITHUB_OUTPUT"
          fi

  rbf:
    needs: changes
    if: ${{ needs.changes.outputs.cores != '[]' && needs.changes.outputs.cores != '' }}
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.changes.outputs.cores) }}
    name: RBF ${{ matrix.core }} (Quartus Lite 17.0)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: build-rbf-${{ github.ref }}-${{ matrix.core }}-${{ github.event.inputs.seed || 'qsf' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Quartus needs ~24 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # Sources go in and results come out as tar streams (no bind mount). Non-login bash keeps
      # the image's PATH (a login shell resets it and loses quartus_sh).
      - name: Compile
        shell: bash
        env:
          CORE: ${{ matrix.core }}
          SC55_SEED: ${{ github.event.inputs.seed }}
          SYNCLAVIER_SEED: ${{ github.event.inputs.seed }}
        run: |
          set -o pipefail
          tar -cf - --exclude=./.git . |
            docker run --rm -i -e CORE -e SC55_SEED -e SYNCLAVIER_SEED raetro/quartus:17.0 bash -c '
              mkdir -p /build && cd /build && tar -xf - || exit 2
              cd cores/$CORE
              if [ "$CORE" = proteus ]; then bash mister/build.sh 1>&2; else mister/build.sh _out 1>&2; fi
              status=$?
              tar -cf - mister/_out mister/output_files mister/build.log 2>/dev/null
              exit $status' |
            (cd cores/${{ matrix.core }} && tar -xf -)

      - name: Upload Quartus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}-quartus-reports
          path: |
            cores/${{ matrix.core }}/mister/output_files/*.rpt
            cores/${{ matrix.core }}/mister/output_files/*.summary
            cores/${{ matrix.core }}/mister/output_files/worst_paths*.txt
            cores/${{ matrix.core }}/mister/output_files/core_*.txt
            cores/${{ matrix.core }}/mister/output_files/sta_paths.log
            cores/${{ matrix.core }}/mister/build.log
          if-no-files-found: warn

      - name: Upload RBF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}-rbf
          path: |
            cores/${{ matrix.core }}/mister/_out/*.rbf
            cores/${{ matrix.core }}/mister/output_files/Proteus.rbf
          if-no-files-found: warn
