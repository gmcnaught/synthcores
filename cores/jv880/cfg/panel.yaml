# JV-880 panel (owner's manual pp. 9-10), rearranged for 800 x 600.
# HDL expressions, in jv880_lcd_video's scope: buttons = jv880_kbd's buttons (mcu.h
# MCU_BUTTON_* for the JV-880; 1 = pressed), leds = sc55_mcu's jv_leds (the LEDs the
# firmware drives: [4:0] UTILITY, RHYTHM, SYSTEM, EDIT, MIDI MESSAGE; [9:5] TONE SWITCH 4-1, PATCH).
bpp: 4
size: [800, 600]
theme: {hint_style: inside, hint: '#e0b040'}
elements:
- type: case
  rect: [4, 8, 792, 584]
  color: '#1e1e20'
- type: label
  at: [20, 26]
  text: JV-880
  size: 13
  weight: Bold
  anchor: lm
- type: lcd
  rect: [16, 50, 768, 104]
  color: '#78a000'
  bezel: 8
- type: knob
