# MU50 front panel for the MiSTer screen (800 x 600). Below the LCD: MAME's mu50.lay (CC0)
# "Internal Layout" view; its LCD window stays dark and the LCD is drawn larger above it by
# hdl/mu50_lcd_video.sv (LCD panel at 80, 48, 640 x 220).
size: [800, 600]
bpp: 5
# HDL expressions, in mu50_lcd_video's scope: keys = mu50_board's keys (1 = pressed; [4:0] row
# O0 bits 2-6, [9:5] O1, [14:10] O2), leds = mu50_board's leds (MAME mulcd LED0-LED4).
input_map:
  - ['O(\d)', 'keys[5*{0}+{bit}-2]']
led_map:
  - ['LED(\d)', 'leds[{0}]']
theme: {background: '#202428', hint_style: inside, hint: '#e0b040'}
# MAME inputtag:inputmask -> PS/2 key (hdl/mu50_top.sv; MAME's own keys)
keys:
  O0:0x04: A
  O0:0x08: E
  O0:0x10: S
  O0:0x20: '['
  O0:0x40: ']'
  O1:0x04: U
  O1:0x08: F
  O1:0x10: '↵'
  O1:0x20: ','
  O1:0x40: .
  O2:0x04: M
  O2:0x10: BS
  O2:0x20: '-'
  O2:0x40: '='
elements:
  - {type: lcd, rect: [80, 48, 640, 220], color: '#9cc4b0', bezel: 10}
  # under the LCD, as on the unit (mu50.lay): the part, MIDI and bank/program cells
  - {type: label, at: [134, 291], text: PART, size: 10, color: '#c8c8c8'}
  - {type: label, at: [220, 291], text: MIDI, size: 10, color: '#c8c8c8'}
  - {type: label, at: [329, 291], text: BANK/PGM#, size: 10, color: '#c8c8c8'}
  - {type: lay, file: mu50.lay, view: 'Internal Layout', rect: [8, 306, 784, 190], lcd: window}
  - {type: strip, at: [16, 560]}
