# Proteus 2000 panel (owner's manual p. 21, 165), rearranged for 800 x 600: LCD on top,
# upper and lower button rows below; the output level meter (y 402) and the diagnostics line
# (y 440) are drawn by p2k_lcd_video in the free space below the panel, the status strip at
# (30, 556).
# HDL expressions, in p2k_lcd_video's scope: buttons = p2k_kbd's buttons[15:7] (1 = pressed),
# leds = the LED word (low byte 0x900000, high byte 0xA00000); the bit of each LED is in
# cores/proteus/docs/p2k-findings.md ("LED bits").
size: [800, 600]
bpp: 5
theme: {background: '#101828', ink: '#101418', hint: '#7a4a00'}
