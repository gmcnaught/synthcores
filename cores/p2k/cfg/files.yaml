# The core's files, in Quartus order. synthcore writes mister/files.qip (search:, files:,
# mister:) and sim/files.f for Verilator (search:, files:). mister: is MiSTer-only.
# Paths starting with modules/ are from the repo root; the rest are from this core's directory.
# The CPU and the sound engine live in cores/proteus/p2k/rtl (iterations 11, 14, 16). TG68K is
# VHDL: Quartus takes it directly (mister:); the Verilator bench converts it with GHDL
# (sim/build.sh).
search:
  - ../proteus/p2k/rtl/snd
files:
  - ../proteus/p2k/rtl/cpu/mcf5206e_periph.sv
  - ../proteus/p2k/rtl/cpu/p2k_cpu.sv
  - ../proteus/p2k/rtl/snd/p2k_ram.sv
  - ../proteus/p2k/rtl/snd/p2k_mul.sv
  - ../proteus/p2k/rtl/snd/p2k_snd_filt.sv
  - ../proteus/p2k/rtl/snd/p2k_fx_sine_rom.sv
  - ../proteus/p2k/rtl/snd/p2k_fx.sv
  - ../proteus/p2k/rtl/snd/p2k_snd.sv
  - modules/synthframe/hdl/mem/synthframe_mem_arb.sv
  - modules/synthframe/hdl/mem/synthframe_mem_ddr3.sv
  - modules/synthframe/hdl/panel/synthframe_hd44780.sv
  - modules/synthframe/hdl/panel/synthframe_vtiming.sv
  - modules/synthframe/hdl/panel/synthframe_charlcd.sv
  - modules/synthframe/hdl/panel/synthframe_status_strip.sv
  - modules/synthframe/hdl/midi/synthframe_midi_rx.sv
  - hdl/p2k_x21.sv
  - hdl/p2k_mem.sv
  - hdl/p2k_sndbus.sv
  - hdl/p2k_board.sv
  - hdl/p2k_loader.sv
  - hdl/p2k_flashsave.sv
  - hdl/p2k_kbd.sv
  - hdl/p2k_midi.sv
  - hdl/p2k_lcd_video.sv
mister:
  - ../proteus/p2k/rtl/cpu/tg68k/TG68K_Pack.vhd
  - ../proteus/p2k/rtl/cpu/tg68k/TG68K_ALU.vhd
  - ../proteus/p2k/rtl/cpu/tg68k/TG68KdotC_Kernel.vhd
  - mister/rtl/pll.qip
  - mister/P2K.sdc
  - mister/P2K.sv
