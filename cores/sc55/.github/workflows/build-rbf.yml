name: Build RBF

# Compiles the MiSTer core (mister/SC55.qpf) with Quartus Lite 17.0 in the
# raetro/quartus:17.0 Docker image on ubuntu-latest. Runs on pull requests
# and pushes to main that touch the HDL or the MiSTer project, and on demand.
# The RBF and the Quartus reports are uploaded as artifacts; mister/build.sh
# fails the job on a failed compile or negative slack (after the reports are
# saved). (Copied from synclavierii's workflow, without its self-hosted runner.)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Fitter seed override (integer; blank = the QSF's)
        required: false
        default: ''
  pull_request:
    paths:
      - 'hdl/**'
      - 'mister/**'
      - '.github/workflows/build-rbf.yml'
  push:
    branches: [main]
    paths:
      - 'hdl/**'
      - 'mister/**'
      - '.github/workflows/build-rbf.yml'

concurrency:
  group: build-rbf-${{ github.ref }}-${{ github.event.inputs.seed || 'qsf' }}
  cancel-in-progress: true

jobs:
  rbf:
    name: RBF (Quartus Lite 17.0)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Quartus needs ~24 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Compile
        id: compile
        shell: bash
        env:
          SC55_SEED: ${{ github.event.inputs.seed }}
        run: |
          set -o pipefail
          tar -cf - --exclude=./.git . |
            docker run --rm -i -e SC55_SEED raetro/quartus:17.0 bash -c '
              mkdir -p /build && cd /build && tar -xf - || exit 2
              mister/build.sh _out 1>&2; status=$?
              tar -cf - mister/_out mister/output_files mister/build.log 2>/dev/null
              exit $status' |
            tar -xf -

      - name: Upload Quartus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            mister/output_files/*.rpt
            mister/output_files/*.summary
            mister/output_files/worst_paths*.txt
            mister/output_files/core_*.txt
            mister/output_files/sta_paths.log
            mister/build.log
          if-no-files-found: warn

      - name: Upload RBF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc55-rbf
          path: mister/_out/*.rbf
          if-no-files-found: warn
